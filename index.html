<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap&subset=cyrillic">
<style>
/* Layout: вертикальная «открытка» 9:19.5 по центру экрана, сцены накладываются друг на друга и открываются волной снизу вверх.
   Палитра: изумруд, золото, пергамент, тауп конверта. Шрифты: Marck Script (имена, заголовки), Cormorant Garamond (мелкий капс-текст). */
:root {
  --emerald-deep: #0a2a52;
  --emerald: #14508f;
  --emerald-light: #2a7bc4;
  --gold: #b7ddf7;
  --gold-soft: #d6ecfb;
  --parchment: #e8f4fd;
  --parchment-ink: #3f7fb5;
  --taupe: #a9c4da;
  --taupe-dark: #7d9db8;
  --ground: #040d1a;
  --script: "Playfair Display", "Times New Roman", Georgia, serif;
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--gold);
  display: grid;
  place-items: stretch;
  padding: 0;
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--serif);
  -webkit-tap-highlight-color: transparent;
}
.stage {
  position: relative;
  width: 100vw;
  width: 100%;
  height: 100svh;
  height: 100dvh;
  aspect-ratio: auto;
  container-type: size;
  overflow: hidden;
  border-radius: 0;
  background: var(--emerald-deep);
  box-shadow: none;
  user-select: none;
}
.scene { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
.scene.active { visibility: visible; }
.s-green { background: var(--emerald); }
.s-cream { background: var(--parchment); }
.scene[data-i="1"] { z-index: 2; }
.scene[data-i="2"] { z-index: 3; }
.scene[data-i="3"] { z-index: 4; }
.scene[data-i="4"] { z-index: 5; }
.scene[data-i="5"] { z-index: 6; }
.scene.enter {
  -webkit-mask-image: linear-gradient(to top, #000 0 33.3%, transparent 66.6%);
  mask-image: linear-gradient(to top, #000 0 33.3%, transparent 66.6%);
  -webkit-mask-size: 100% 300%; mask-size: 100% 300%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  animation: wipe 1.9s cubic-bezier(.6,.05,.3,1) both;
}
@keyframes wipe {
  from { -webkit-mask-position: 0 0; mask-position: 0 0; }
  to   { -webkit-mask-position: 0 100%; mask-position: 0 100%; }
}

/* акварельный фон */
.wash { position: absolute; inset: 0; pointer-events: none; }
.wash::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(60% 40% at 20% 15%, rgba(70,140,215,.55), transparent 70%),
    radial-gradient(55% 45% at 85% 40%, rgba(4,24,58,.75), transparent 70%),
    radial-gradient(70% 45% at 30% 80%, rgba(45,115,190,.45), transparent 70%),
    radial-gradient(50% 35% at 80% 95%, rgba(3,20,48,.8), transparent 70%);
}
.wash svg { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: overlay; opacity: .55; }

/* обложка */
.cover { position: absolute; inset: 0; z-index: 10; cursor: pointer; }
.cover.gone { pointer-events: none; }
.door { position: absolute; top: 0; bottom: 0; width: 50.2%; background: linear-gradient(160deg, #c3d8e8, var(--taupe) 55%, #8fb0cb); transition: transform 1.5s cubic-bezier(.7,0,.25,1) .25s; overflow: hidden; }
.door.l { left: 0; }
.door.r { right: 0; }
.door.l::after, .door.r::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(0,0,0,.18); }
.door.l::after { right: 0; } .door.r::after { left: 0; }
.cover.open .door.l { transform: translateX(-102%); }
.cover.open .door.r { transform: translateX(102%); }
.door .vine { position: absolute; width: 70cqw; opacity: .9; }
.seal {
  position: absolute; left: 50%; top: 50%; width: 26cqw; aspect-ratio: 1;
  transform: translate(-50%,-50%); border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #9fd0f2, #3f86c4 60%, #1d4f87);
  box-shadow: 0 1.2cqw 3cqw rgba(0,0,0,.45), inset 0 0 0 1.2cqw rgba(235,247,255,.25), inset 0 -1cqw 2cqw rgba(0,0,0,.35);
  color: #0c2f5a; font-family: var(--script); font-style: italic; font-size: 6.8cqw; line-height: 1; white-space: nowrap;
  display: grid; place-items: center; transition: transform .9s ease, opacity .9s ease;
  text-shadow: 0 1px 0 rgba(235,247,255,.55);
}
.seal:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 4px; }
.cover.open .seal { transform: translate(-50%,-50%) scale(1.5) rotate(8deg); opacity: 0; }
.hint {
  position: absolute; left: 0; right: 0; top: 62%; text-align: center; font-size: 3.4cqw;
  letter-spacing: .28em; text-transform: uppercase; color: #fff6; color: rgba(240,249,255,.9);
  animation: pulse 2.4s ease-in-out infinite; transition: opacity .5s;
}
.cover.open .hint { animation: none; opacity: 0; }
@keyframes pulse { 50% { opacity: .35; } }

/* сцена 1: приглашение */
.wreath { position: absolute; left: 50%; top: 8cqh; width: 74cqw; transform: translateX(-50%); }
.wreath svg { width: 100%; display: block; overflow: visible; }
.stem { fill: none; stroke: var(--gold); stroke-width: .9; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.leaf { fill: var(--gold); opacity: 0; }
.s1.active .stem { animation: draw 2.6s .9s cubic-bezier(.5,0,.3,1) forwards; }
.s1.active .leaf { animation: fadein .7s var(--d) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: .95; } }
.mono {
  position: absolute; left: 50%; width: 66cqw; max-width: 66cqw; top: calc(8cqh + 37cqw); transform: translate(-50%,-50%); box-sizing: border-box; overflow: hidden;
  display: flex; align-items: center; justify-content: center; gap: .6cqw;
  text-align: center; font-family: var(--script); font-style: italic; font-size: 18cqw; line-height: 1; color: var(--gold);
  text-shadow: 0 0 3cqw rgba(183,221,247,.25);
}
.mono span { flex: 0 1 auto; min-width: 0; }
.mono span:nth-child(2) { margin: 0; }
/* Keep the initials centered after the rise-in animation; the generic rise animation must not erase the centering transform. */
.s1.active .mono { animation: monoRise 1.1s 2.4s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes monoRise { from { opacity: 0; transform: translate(-50%, calc(-50% + 1.6cqw)); } to { opacity: 1; transform: translate(-50%,-50%); } }
.seal { display:flex; align-items:center; justify-content:center; padding:0; }
.seal span { display:block; line-height:1; transform:translateX(-.04em); }
.copy { position: absolute; left: 0; right: 0; top: calc(8cqh + 79cqw); text-align: center; padding-inline: 5cqw; }
#t-date, #t-place { display:none; }
.eyebrow { font-size: 3.1cqw; letter-spacing: .08em; line-height: 1.45; }
.names { font-size: 12cqw; white-space: normal; }
.guest-divider {
  position: relative;
  width: 32cqw;
  height: 1px;
  margin: 1.35cqh auto .2cqh;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: .85;
}
.guest-divider::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1.5cqw;
  height: 1.5cqw;
  border: .25cqw solid var(--gold);
  background: var(--emerald);
  transform: translate(-50%, -50%) rotate(45deg);
  box-sizing: border-box;
}
.guest-callout { width: 90%; margin: 1.2cqh auto 0; font-family: var(--script); font-style: italic; font-size: 10cqw; line-height: 1.12; font-weight: 600; letter-spacing: 0; color: var(--gold); text-shadow: 0 0 3cqw rgba(183,221,247,.25); overflow-wrap: anywhere; }
.sub { font-size: 3.2cqw; letter-spacing: .12em; }
.eyebrow { font-size: 2.5cqw; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.names { font-family: var(--script); font-style: italic; font-style: italic; font-size: 10cqw; line-height: 1.15; margin-top: 2.5cqh; color: var(--gold); white-space: nowrap; }
.sub { font-size: 2.6cqw; letter-spacing: .24em; text-transform: uppercase; margin-top: 1.8cqh; color: var(--gold-soft); font-weight: 600; }
.rule { height: 1px; background: var(--gold); opacity: .75; margin: 1.8cqh 4cqw 1.4cqh; transform-origin: left; }
.date { font-size: 3.4cqw; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.place { margin-top: 2cqh; font-size: 2.6cqw; letter-spacing: .22em; text-transform: uppercase; line-height: 1.7; color: var(--gold-soft); opacity: .85; }
.rise { opacity: 0; }
.scene.active .rise { animation: rise 1.1s var(--d, 0s) cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(1.6cqw); } to { opacity: 1; transform: none; } }
/* Keep the monogram centered: the generic .rise animation must not override its horizontal centering. */
.scene.active.s1 .mono.rise { animation: monoRise 1.1s 2.4s cubic-bezier(.2,.7,.2,1) forwards; }
.scene.active .rule.rise { animation: ruleIn 1.1s var(--d) ease forwards; transform: scaleX(0); }
@keyframes ruleIn { from { opacity: 0; transform: scaleX(0); } to { opacity: .75; transform: scaleX(1); } }

/* сцена 2: календарь даты торжества */
.calendar-scene { background: linear-gradient(155deg, #eaf6ff, #c9e4f8 55%, #e6f3fd); color: #245987; }
.calendar-wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10cqw; text-align:center; }
.calendar-kicker { font-size:2.8cqw; letter-spacing:.22em; text-transform:uppercase; color:#4b83b3; }
.calendar-heading { font-family:var(--script); font-style:italic; font-size:12cqw; line-height:1.1; color:#245987; margin:2.5cqh 0 1cqh; }
.calendar-year { font-size:4cqw; letter-spacing:.35em; color:#4b83b3; margin-bottom:3cqh; }
.calendar { width:100%; max-width:74cqw; border-top:1px solid rgba(36,89,135,.35); padding-top:2cqh; }
.calendar-week, .calendar-days { display:grid; grid-template-columns:repeat(7,1fr); align-items:center; justify-items:center; }
.calendar-week { font-size:2.8cqw; color:#5b8db8; margin-bottom:1.2cqh; }
.calendar-days { row-gap:1.25cqh; font-size:3.6cqw; color:#245987; }
.calendar-days span { display:grid; place-items:center; width:7.5cqw; aspect-ratio:1; }
.calendar-days .chosen { border:1.5px solid #2c73ad; border-radius:50%; background:rgba(255,255,255,.35); font-weight:700; box-shadow:0 0 0 3px rgba(44,115,173,.10); }
.calendar-caption { font-family:var(--script); font-style:italic; font-size:6cqw; line-height:1.2; color:#245987; margin-top:4cqh; max-width:80%; }

/* сцена 2: программа */
.corner { position: absolute; width: 58cqw; color: #6fa9d8; opacity: .8; }
.corner.tr { right: -8cqw; top: -6cqw; width: 44cqw; }
.corner.bl { left: -8cqw; bottom: -4cqw; transform: rotate(180deg); }
.corner.br { right: -10cqw; bottom: -6cqw; transform: scaleY(-1); width: 50cqw; opacity: .6; }
.prog-title { position: absolute; left: 11cqw; top: 8.5cqh; font-family: var(--script); font-style: italic; font-size: 13cqw; color: var(--parchment-ink); line-height: 1; }
.timeline { position: absolute; left: 11cqw; top: 22cqh; right: 12cqw; }
.ev { position: relative; padding-bottom: 6.8cqh; }
.ev .t { font-size: 4.2cqw; letter-spacing: .16em; color: var(--parchment-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.ev .d { font-size: 4.1cqw; letter-spacing: .16em; text-transform: uppercase; color: var(--parchment-ink); margin-top: .7cqh; font-weight: 700; text-decoration: underline; text-decoration-thickness: .25cqw; text-underline-offset: .8cqw; line-height:1.35; }
/* Removed the vertical connector: it crossed into the next event label on narrow phone screens. */
.ev::after { content: none; }
.ev:not(:last-child) { transform-origin: top; }

/* сцена 3: финал */
.s3 { background: #cdbfa8; }
.photo { position: absolute; inset: 0; background-size: cover; background-position: 50% 20%; }
.photo.empty {
  background:
    radial-gradient(60% 40% at 50% 38%, rgba(232,244,253,.9), transparent 70%),
    linear-gradient(180deg, #d9eaf7, #8fb4d3);
}
.photo.empty::after {
  content: "Здесь будет ваше фото"; position: absolute; left: 0; right: 0; top: 30%; text-align: center;
  font-size: 3.2cqw; letter-spacing: .22em; text-transform: uppercase; color: rgba(40,80,120,.7); font-weight: 600;
}
.ink { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; background: var(--emerald);
  -webkit-mask-image: linear-gradient(to top, #000 55%, transparent); mask-image: linear-gradient(to top, #000 55%, transparent); }
.ink::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 50% at 30% 70%, rgba(70,140,215,.5), transparent 70%), radial-gradient(50% 50% at 85% 90%, rgba(3,20,48,.8), transparent 70%); }
.final { position: absolute; left: 0; right: 0; bottom: 5cqh; text-align: center; padding-inline: 9cqw; font-size: 3.1cqw; letter-spacing: .24em; text-transform: uppercase; line-height: 1.9; color: var(--gold); font-weight: 600; }
.final b { display: block; line-height: 1.2; font-family: var(--script); font-style: italic; font-size: 8.5cqw; letter-spacing: .02em; text-transform: none; font-weight: 400; margin-top: 1cqh; }
#t-final { display:block; font-size:5.1cqw; letter-spacing:.01em; text-transform:none; line-height:1.42; font-weight:800; text-decoration:underline; text-decoration-thickness:.22cqw; text-underline-offset:.8cqw; }
#t-final2 { font-size:4.8cqw; letter-spacing:.01em; line-height:1.2; margin-top:2cqh; font-weight:800; }


/* Сцена 5: ресторан и карта */
.restaurant-scene { background: #eaf4fc; color: #245987; }
.restaurant-photo { position:absolute; inset:0; background-size:cover; background-position:center center; }
.restaurant-shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(4,18,35,.05) 20%,rgba(4,18,35,.18) 45%,rgba(4,18,35,.88) 100%); }
.restaurant-info { position:absolute; left:7cqw; right:7cqw; bottom:10cqh; text-align:center; color:#fff; }
.restaurant-title { font-family:var(--script); font-style:italic; font-size:13cqw; line-height:1.1; text-shadow:0 2px 12px #06182d; }
.restaurant-caption { font-size:3.4cqw; letter-spacing:.12em; margin-top:2cqh; text-transform:uppercase; }
.map-link { display:inline-flex; align-items:center; justify-content:center; margin-top:3cqh; padding:3.2cqw 6cqw; border-radius:999px; background:#e7f4ff; color:#164b7b; text-decoration:none; font:600 3.4cqw var(--serif); letter-spacing:.04em; border:1px solid rgba(255,255,255,.8); box-shadow:0 4px 18px rgba(0,0,0,.2); }
.map-link:focus-visible { outline:2px solid white; outline-offset:4px; }

.tools { position: absolute; z-index: 20; left: 0; right: 0; bottom: 1.6cqh; display: flex; justify-content: center; gap: 2cqw; pointer-events: none; }
.chip {
  pointer-events: auto; font: 600 2.6cqw var(--serif); letter-spacing: .18em; text-transform: uppercase;
  color: var(--gold); background: rgba(4,13,26,.55); border: 1px solid rgba(183,221,247,.55);
  padding: 1.1cqw 3cqw; border-radius: 99px; cursor: pointer; opacity: 0; visibility: hidden; transition: opacity .6s;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.chip.show { opacity: 1; visibility: visible; }
.chip:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
.dots { position: absolute; z-index: 20; right: 3cqw; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2cqw; pointer-events: none; }
.dots i { width: 1.2cqw; height: 1.2cqw; border-radius: 50%; background: rgba(183,221,247,.35); transition: background .4s, transform .4s; }
.dots i.on { background: var(--gold); transform: scale(1.4); }
.dots.dark i { background: rgba(63,127,181,.35); } .dots.dark i.on { background: var(--parchment-ink); }
@media (prefers-reduced-motion: reduce) {
  .scene.enter { animation-duration: .01s; }
  .scene.active .rise, .s1.active .stem, .s1.active .leaf, .hint { animation-delay: 0s !important; animation-duration: .01s !important; }
}
</style>

  <!-- Сцена 5: ресторан -->
  <section class="scene restaurant-scene" data-i="5" id="s-restaurant">

    <div class="restaurant-shade"></div>
    <div class="restaurant-info rise" style="--d:.7s">

  <!-- Обложка -->

/* ===== Рисование золотых веточек ===== */
const NS = "http://www.w3.org/2000/svg";
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function bez(p, t) {
  const u = 1 - t;
  return [
    u*u*u*p[0] + 3*u*u*t*p[2] + 3*u*t*t*p[4] + t*t*t*p[6],
    u*u*u*p[1] + 3*u*u*t*p[3] + 3*u*t*t*p[5] + t*t*t*p[7]
  ];
}
function leafAt(g, x, y, ang, size, color, delay) {
  const l = el("ellipse", { cx: 0, cy: 0, rx: size, ry: size * 0.38, fill: color, opacity: .9 }, g);
  l.setAttribute("transform", `translate(${x} ${y}) rotate(${ang}) translate(${size} 0)`);
  return l;
}
function drawVines() {
  document.querySelectorAll("[data-vine]").forEach(svg => {
    svg.innerHTML = "";
    const g = el("g", { fill: "currentColor", stroke: "currentColor" }, svg);
    const main = [4, 2, 30, 50, 90, 60, 112, 140];
    el("path", { d: `M${main[0]} ${main[1]} C${main[2]} ${main[3]} ${main[4]} ${main[5]} ${main[6]} ${main[7]}`, fill: "none", "stroke-width": .9, "stroke-linecap": "round" }, g);
    for (let i = 1; i < 16; i++) {
      const t = i / 16, [x, y] = bez(main, t), [x2, y2] = bez(main, t + .02);
      const a = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI;
      const side = i % 2 ? 1 : -1;
      leafAt(g, x, y, a + side * (42 + rnd() * 18), 5 + rnd() * 3.5, "currentColor");
      if (i % 4 === 0) {
        const br = [x, y, x + side * 14, y + 10, x + side * 22, y + 28, x + side * 24, y + 40];
        el("path", { d: `M${br[0]} ${br[1]} C${br[2]} ${br[3]} ${br[4]} ${br[5]} ${br[6]} ${br[7]}`, fill: "none", "stroke-width": .7 }, g);
        for (let j = 1; j < 5; j++) {
          const [bx, by] = bez(br, j / 5);
          leafAt(g, bx, by, 90 - side * 20 + (j % 2 ? 40 : -40), 3.5 + rnd() * 2, "currentColor");
        }
      }
    }
  });
}
function drawWreath() {
  const svg = document.getElementById("wreath");
  svg.innerHTML = "";
  const R = 78, C = 100;
  const pt = (deg, r) => [C + r * Math.cos(deg * Math.PI / 180), C + r * Math.sin(deg * Math.PI / 180)];
  const leaves = el("g", {}, svg);
  [[1, 1], [-1, 1]].forEach(([dir], k) => {
    const start = 100, end = start + dir * 280;
    const wob = a => R + Math.sin(a * 0.11) * 2.5;
    let d = "";
    for (let a = 0; a <= 280; a += 4) {
      const ang = start + dir * a, [x, y] = pt(ang, wob(a));
      d += (a ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    }
    el("path", { d, class: "stem", pathLength: 1 }, svg);
    for (let a = 8; a < 280; a += 7) {
      const ang = start + dir * a, [x, y] = pt(ang, wob(a));
      const tang = ang + dir * 90;
      const out = (a / 7) % 2 ? 1 : -1;
      const size = 6.5 - (a / 280) * 2 + rnd() * 1.5;
      const l = el("ellipse", { class: "leaf", cx: 0, cy: 0, rx: size, ry: size * .36 }, leaves);
      l.setAttribute("transform", `translate(${x} ${y}) rotate(${tang + out * 38}) translate(${size} 0)`);
      l.style.setProperty("--d", (1.1 + (a / 280) * 2.6 + k * .05).toFixed(2) + "s");
      if (a % 28 === 0) {
        const bx = pt(ang, wob(a) + out * 8);
        const b = el("circle", { class: "leaf", cx: bx[0], cy: bx[1], r: 1.2 }, leaves);
        b.style.setProperty("--d", (1.3 + (a / 280) * 2.6).toFixed(2) + "s");
      }
    }
  });
}

function setPhoto(src) {
  const p = $("photo");
  if (src) { p.style.backgroundImage = `url("${src}")`; p.classList.remove("empty"); }
  else { p.style.backgroundImage = ""; p.classList.add("empty"); }
}

/* ===== Показ сцен ===== */
const scenes = [null, $("s1"), $("s-calendar"), $("s2"), $("s3"), $("s-restaurant")];
let timers = [], cur = 0, opened = false;
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
function dots(i) {
  [...$("dots").children].forEach((d, k) => d.classList.toggle("on", k === i - 1));
  $("dots").classList.toggle("dark", i === 2);
}
function go(i) {
  timers.forEach(clearTimeout); timers = [];
  if (i < 1 || i > 5) return;
  cur = i;
  const s = scenes[i];
  s.classList.remove("active", "enter");
  void s.offsetWidth;
  s.classList.add("active");
  if (i > 1) s.classList.add("enter");
  dots(i);
  $("btn-replay").classList.remove("show");
  if (i === 1) later(() => go(2), CONFIG.holdScene1);
  if (i === 2) later(() => go(3), 9500);
  if (i === 3) later(() => go(4), 10500);
  if (i === 4) later(() => go(5), CONFIG.holdScene2);
  if (i === 5) later(() => $("btn-replay").classList.add("show"), 3500);
  if (CONFIG.photoButton) $("btn-photo").classList.toggle("show", i === 4);
}
function open() {
  if (opened) return;
  opened = true;
  $("cover").classList.add("open");
  go(1);
  setTimeout(() => $("cover").classList.add("gone"), 2000);
}
function replay() {
  timers.forEach(clearTimeout);
  scenes.forEach(s => s && s.classList.remove("active", "enter"));
  const c = $("cover");
  c.classList.remove("gone", "open");
  opened = false; cur = 0;
  $("btn-replay").classList.remove("show"); $("btn-photo").classList.remove("show");
  [...$("dots").children].forEach(d => d.classList.remove("on"));
}

$("cover").addEventListener("click", open);
$("stage").addEventListener("click", e => {
  if (!opened || e.target.closest(".chip") || e.target.closest(".cover") || e.target.closest(".map-link")) return;
  if (cur < 5) go(cur + 1);
});
$("btn-replay").addEventListener("click", e => { e.stopPropagation(); replay(); });
$("btn-photo").addEventListener("click", e => { e.stopPropagation(); $("file").click(); });
$("file").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => setPhoto(r.result);
  r.readAsDataURL(f);
});


// Personal guest name from a short URL such as ?g=a7K2m
(function personalizeGuest() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("g");
  const records = window.WEDDING_GUESTS || {};
  if (code && Object.prototype.hasOwnProperty.call(records, code)) {
    CONFIG.guest = records[code];
  }
})();
drawVines(); drawWreath(); fill();
